version: '3.8'

services:
  truck-fatigue-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: truck_fatigue_detector
    restart: unless-stopped
    ports:
      - "5000:5000"
    devices:
      # Video capture device (USB webcam / CSI camera)
      - "/dev/video0:/dev/video0"
      # Raspberry Pi 5 RP1 GPIO access
      - "/dev/gpiochip4:/dev/gpiochip4"
    volumes:
      # Optional: bind models or logs externally
      - ../models:/app/models:ro
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
    privileged: true
